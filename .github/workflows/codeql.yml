name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            os: ubuntu-24.04
            build_mode: none
          - language: swift
            os: macos-15
            build_mode: manual
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - name: Build Swift
        if: matrix.language == 'swift'
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project OutputLens.xcodeproj -scheme OutputLens \
            -destination 'platform=macOS' -derivedDataPath /tmp/magi-codeql \
            CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
