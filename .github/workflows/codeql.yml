name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            os: ubuntu-24.04
            build_mode: none
          - language: swift
            os: macos-15
            build_mode: manual
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - name: Build Swift
        if: matrix.language == 'swift'
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project OutputLens.xcodeproj -scheme OutputLens \
            -destination 'platform=macOS' -derivedDataPath /tmp/magi-codeql \
            CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
