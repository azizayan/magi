name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    name: Swift tests and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Analyze
        run: |
          xcodegen generate
          xcodebuild -project OutputLens.xcodeproj -scheme OutputLens \
            -destination 'platform=macOS' -derivedDataPath /tmp/magi-analyze \
            CODE_SIGNING_ALLOWED=NO analyze
      - name: Test
        run: |
          xcodebuild -project OutputLens.xcodeproj -scheme OutputLens \
            -destination 'platform=macOS' -derivedDataPath /tmp/magi-tests \
            CODE_SIGNING_ALLOWED=NO test
      - name: Verify local package boundary
        run: |
          ./scripts/package-macos.sh
          test -f dist/Magi-macos-UNNOTARIZED.zip
          test -f dist/Magi-macos-UNNOTARIZED.zip.sha256
          test ! -e dist/Magi-macos.zip
          shasum -a 256 -c dist/Magi-macos-UNNOTARIZED.zip.sha256

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev
      - name: Configure Rust
        run: rustup update stable && rustup component add clippy rustfmt
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  rustsec:
    name: RustSec audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
