[package]
name = "magi"
version = "0.1.0"
edition = "2024"
description = "A cross-platform reading lens for AI coding app output"
license = "MIT"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
global-hotkey = "0.8.0"
pulldown-cmark = "0.13.4"
serde = { version = "1.0", features = ["derive"] }

# tray-icon's Linux backend still depends on the unmaintained GTK3 bindings.
# Keep the tray on supported native backends; Linux retains the window and
# global shortcut without pulling an unsound runtime dependency graph.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
