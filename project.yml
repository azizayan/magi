name: OutputLens

options:
  bundleIdPrefix: com.azizemreayan
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  OutputLens:
    type: application
    platform: macOS
    sources:
      - path: OutputLens
    info:
      path: OutputLens/Info.plist
      properties:
        CFBundleDisplayName: Output Lens
        CFBundleName: Output Lens
        LSUIElement: true
        NSAccessibilityUsageDescription: Output Lens uses Accessibility access to read the Codex or Claude response you select.
        NSHumanReadableCopyright: Copyright © 2026
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azizemreayan.OutputLens
        PRODUCT_NAME: OutputLens
        CODE_SIGN_IDENTITY: "-"

  OutputLensTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OutputLensTests
    dependencies:
      - target: OutputLens

schemes:
  OutputLens:
    build:
      targets:
        OutputLens: all
        OutputLensTests: [test]
    test:
      targets:
        - OutputLensTests
