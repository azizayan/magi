name: OutputLens

options:
  bundleIdPrefix: com.azizemreayan
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  OutputLens:
    type: application
    platform: macOS
    sources:
      - path: OutputLens
    info:
      path: OutputLens/Info.plist
      properties:
        CFBundleDisplayName: Magi
        CFBundleName: Magi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSAccessibilityUsageDescription: Magi uses Accessibility access to read the Codex or Claude response or editable input you Option-click, including supported terminals.
        NSHumanReadableCopyright: Copyright © 2026
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azizemreayan.OutputLens
        PRODUCT_NAME: OutputLens
        CODE_SIGN_IDENTITY: "-"

  OutputLensTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OutputLensTests
    dependencies:
      - target: OutputLens
      - target: MagiIntegrationHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MagiIntegrationHost:
    type: application
    platform: macOS
    sources:
      - path: IntegrationHost
    info:
      path: IntegrationHost/Info.plist
      properties:
        CFBundleDisplayName: Magi Integration Host
        CFBundleName: Magi Integration Host
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azizemreayan.MagiIntegrationHost
        PRODUCT_NAME: MagiIntegrationHost
        CODE_SIGN_IDENTITY: "-"

schemes:
  OutputLens:
    build:
      targets:
        OutputLens: all
        OutputLensTests: [test]
    test:
      targets:
        - OutputLensTests

  OutputLensIntegration:
    build:
      targets:
        OutputLens: all
        MagiIntegrationHost: all
        OutputLensTests: [test]
    test:
      environmentVariables:
        MAGI_RUN_AX_INTEGRATION: "1"
      targets:
        - OutputLensTests
